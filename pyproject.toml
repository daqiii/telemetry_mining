[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-mining"
version = "0.1.0"
description = "Tools for analyzing DESI instrument telemetry and operational data"
requires-python = ">=3.10"
dependencies = [
    "psycopg2",
    "fitsio",
    "pandas",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires NERSC filesystem access and a live DB connection",
]
